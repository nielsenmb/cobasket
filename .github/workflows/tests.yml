name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run core tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q --ignore=tests/test_gui_smoke.py 2>&1 | tee pytest-core.log
      - name: Upload core test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-core-${{ matrix.python-version }}
          path: pytest-core.log

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            xvfb \
            xauth
      - name: Install package
        run: python -m pip install -e ".[test,gui]"
      - name: Run GUI smoke test
        run: xvfb-run -a pytest -q tests/test_gui_smoke.py
