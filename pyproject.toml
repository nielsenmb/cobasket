[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobasket"
version = "0.3.0"
description = "Transparent cointegration research and long-only decision support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "yfinance",
    "statsmodels",
    "scipy",
    "matplotlib",
    "pyarrow",
    "lxml",
    "scikit-learn",
]

[project.scripts]
cobasket-backtest = "cobasket.cli:backtest_cmd"
cobasket-screen = "cobasket.cli:screen_cmd"
cobasket-pca-screen = "cobasket.cli:pca_screen_cmd"

[tool.hatch.build.targets.wheel]
packages = ["cobasket"]

[project.optional-dependencies]
test = ["pytest>=7"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
