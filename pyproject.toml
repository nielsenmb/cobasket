[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cobasket"
dynamic = ["version"]
description = "Transparent cointegration research and long-only decision support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Martin Nielsen"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy",
    "pandas",
    "yfinance",
    "statsmodels",
    "scipy",
    "matplotlib",
    "pyarrow",
    "lxml",
    "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/nielsenmb/cobasket"
Repository = "https://github.com/nielsenmb/cobasket"
Issues = "https://github.com/nielsenmb/cobasket/issues"

[project.scripts]
cobasket-backtest = "cobasket.cli:backtest_cmd"
cobasket-screen = "cobasket.cli:screen_cmd"
cobasket-pca-screen = "cobasket.cli:pca_screen_cmd"
cobasket-calibrate = "cobasket.calibration_cli:main"
cobasket-report = "cobasket.report_cli:main"
cobasket-gui = "cobasket.gui:main"
cobasket-edit = "cobasket.gui.editor_cli:main"

[tool.hatch.version]
path = "cobasket/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["cobasket"]

[project.optional-dependencies]
test = ["pytest>=7", "nbformat>=5", "build>=1", "twine>=5"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]
gui = ["PyQt6>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
